name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      # requires-python é ">=3.8": o CI tem de honrar a matriz completa.
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Sem isto os testes falham no runner limpo: test_offline/test_regressions
        # importam src.ai_client (tenacity, requests) e test_installation importa
        # src.config_manager (python-dotenv, psutil).
        run: python3 -m pip install -r requirements.txt build "setuptools>=61" wheel

      - name: Byte-compile all sources
        run: python3 -m compileall -q src tests plugins scripts

      - name: Run test suite
        run: python3 -m unittest discover -s tests -v

      - name: Lint (ruff)
        # Falhável: o lint anterior (pyflakes com continue-on-error) nunca
        # conseguia quebrar o build. O projeto já define [tool.ruff] no pyproject.
        run: |
          python3 -m pip install ruff
          python3 -m ruff check src/ tests/ plugins/ scripts/

      - name: Shellcheck installers
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh run.sh

  gtk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-gtk-3.0 python3-venv xvfb libxtst6 dbus-daemon desktop-file-utils librsvg2-common
          /usr/bin/python3 -m venv --system-site-packages .venv-gtk
          .venv-gtk/bin/python -m pip install -r requirements.txt
          .venv-gtk/bin/python -m pip install ".[encryption]" build "setuptools>=61" wheel
      - name: Test Linux and GTK capabilities and reject unexpected skips
        run: |
          xvfb-run -a .venv-gtk/bin/python scripts/run_gtk_tests.py

  qt-linux:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real Qt bindings and shared dependencies
        run: python -m pip install ".[qt]"
      - name: Run all Qt tests and reject unexpected skips
        run: python scripts/run_qt_tests.py

  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Windows and Qt dependencies
        run: python -m pip install ".[qt]" build "setuptools>=61" wheel
      - name: Byte-compile all sources
        run: python -m compileall -q src tests plugins scripts
      - name: Test native persistence, processes, startup and Qt
        # Selects Windows, PowerShell, Qt, README and updater tests.
        # A Windows capability skip or missing Qt import fails the job.
        run: python scripts/run_windows_tests.py
      - name: Validate installer scripts and assets
        # Validates PowerShell syntax (PS parser), .iss file references,
        # .spec PyInstaller options and asset presence (ico, svg).
        run: python -m unittest tests.test_installer_assets -v
      - name: Build the distribution
        run: python -m build --wheel
      - name: Install and smoke-test the wheel outside the checkout
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/winlinai-*.whl | Select-Object -First 1).FullName
          $probeRoot = Join-Path $env:RUNNER_TEMP "winlinai-wheel-smoke"
          python -m venv $probeRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probePython = Join-Path $probeRoot "Scripts/python.exe"
          & $probePython -m pip install "${wheel}[qt]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item scripts/smoke_installed_package.py (Join-Path $probeRoot "smoke_installed_package.py")
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          Set-Location $probeRoot
          & $probePython smoke_installed_package.py
          exit $LASTEXITCODE
