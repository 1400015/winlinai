[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winlinai"
# Versão única: lida de src/_version.py (sem importar o pacote — setuptools
# lê o literal por AST); antes estava espalhada por 5+ ficheiros.
dynamic = ["version"]
description = "Assistente de IA permanente para Linux com interface flutuante"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Linux AI Assistant Team" }]
keywords = ["linux", "ai", "gtk", "assistant", "desktop"]

dependencies = [
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.5",
    "tenacity>=8.2.3",
    "notify2>=0.3.1; sys_platform == 'linux'",
    "pywin32>=306; sys_platform == 'win32'",
    "PyYAML>=6.0.3,<7",
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
# Encriptação de API keys em config.json (app.encryption_enabled)
encryption = ["cryptography>=42.0.2"]
# Optional desktop keyring support; importing the client must not require it.
secret-service = ["secretstorage>=3.3,<4"]
# Qt shell (phase 4a of the Windows track): optional; src/qt_app.py degrades
# gracefully and the GTK track does not import it.
qt = ["PySide6>=6.6"]
dev = [
    "ruff>=0.5",
    "mypy==2.4.0; python_version >= '3.10'",
    "coverage>=7.4",
]

[project.urls]
Homepage = "https://github.com/1400015/winlinai"
Source = "https://github.com/1400015/winlinai"
"Bug Reports" = "https://github.com/1400015/winlinai/issues"

[project.scripts]
linux-ai-assistant = "src.app:main"
winlinai = "src.app:main"

[tool.setuptools.packages.find]
include = ["src", "src.*", "plugins", "plugins.*"]
namespaces = false

[tool.setuptools.package-data]
src = ["knowledge_data/*.yaml", "knowledge_data/schema/*.json"]

[tool.setuptools.dynamic]
version = { attr = "src._version.__version__" }

# themes/ is not a Python package (no __init__.py), so its JSON files are
# shipped as data files; ConfigManager falls back to
# <sys.prefix>/share/linux-ai-assistant/themes when the source tree is absent.
[tool.setuptools.data-files]
"share/linux-ai-assistant/themes" = ["themes/*.json"]
"share/linux-ai-assistant" = ["assets/io.github.linux_ai_assistant.ico"]
"share/applications" = ["scripts/linux-ai-assistant.desktop"]
"share/icons/hicolor/scalable/apps" = ["assets/io.github.linux_ai_assistant.svg"]

[tool.ruff]
line-length = 110
target-version = "py38"

[tool.ruff.lint]
# O projecto usa muitos except: vazios; focusing on erros reais.
select = ["E", "F", "W"]
ignore = [
    "E501",   # linhas longas
    "E722",   # except: vazio intencional em fallbacks
    "E741",
    "E402",   # imports após gi.require_version()/sys.path hacks (padrão GTK/testes)
]

[tool.ruff.lint.per-file-ignores]
"src/app.py" = ["F401"]  #Gtk/Gdk importados condicionalmente
"src/main_window.py" = ["F401"]

[tool.mypy]
# A gradual gate, not a claim that the entire application is fully typed.
# Mypy 2.4 requires Python >=3.10; the runtime's >=3.8 compatibility remains
# covered by the existing test matrix. This analysis uses the CI's Python 3.12.
python_version = "3.12"
platform = "linux"
files = [
    # Core modules (initial gate)
    "src/render_core.py",
    "src/build_info.py",
    "src/system_context.py",
    "src/credential_store.py",
    "src/action_contract.py",
    "src/bounded_http.py",
    "src/provider_modes.py",
    "src/file_actions.py",
    "src/history_store.py",
    "src/local_knowledge.py",
    "src/knowledge_loader.py",
    "src/display_actions.py",
    "src/offline_assistant.py",
    "src/trial_dialog.py",
    "src/cli.py",
    "src/cli_commands/__init__.py",
    "src/cli_commands/parsers.py",
    "src/history_recovery.py",
    # Theme utilities (refactored from main_window.py)
    "src/theme_utils.py",
    "src/main_window_themes.py",
    # Windows foundation (phase 1)
    "src/windows_autostart.py",
    "src/platform/tray_config.py",
    "src/platform/pwsh_output.py",
    # Qt track (phases 2-4)
    "src/qt_theme.py",
    "src/qt_conversation_actions.py",
    "src/qt_worker.py",
    "src/qt_chat.py",
    "src/qt_app.py",
    "src/qt_dialogs.py",
    "src/qt_tray.py",
    # Shared assistant context (used by both GTK and Qt tracks)
    "src/assistant_context.py",
    "src/chat_core.py",
    # Windows-specific modules
    "src/windows_screenshot.py",
    "src/windows_system_actions.py",
    "src/windows_file_actions.py",
    # Platform helpers
    "src/platform/shell_pwsh.py",
    # Updater
    "src/updater.py",
    # Provider split (shared errors + per-provider request modules)
    "src/ai_errors.py",
    "src/ai_providers/__init__.py",
    "src/ai_providers/sse.py",
    "src/ai_providers/openai_style.py",
    "src/ai_providers/openrouter.py",
    "src/ai_providers/google.py",
    "src/ai_providers/anthropic.py",
    "src/ai_providers/mistral.py",
    "src/ai_providers/groq.py",
    "src/ai_providers/cohere.py",
    "src/ai_providers/local_llm.py",
    # Assistant core and desktop shells (typing phase 3)
    "src/ai_client.py",
    "src/schema_validation.py",
    "src/device_actions.py",
    "src/conversation_actions.py",
    "src/diagnostics.py",
    "src/package_actions.py",
    "src/stream_events.py",
    "src/device_dialogs.py",
    "src/conversation_dialog.py",
    "src/chat_view.py",
    "src/main_window.py",
    "src/main_window_settings.py",
    "src/main_window_theme_dialogs.py",
    "src/main_window_dialogs.py",
    "src/main_window_capture.py",
    "src/main_window_ui.py",
    "src/main_window_offline.py",
    "src/main_window_chat_flow.py",
    "src/main_window_bootstrap.py",
    "src/app.py",
    "src/qt_file_dialogs.py",
    # WSL bridge: parses wsl.exe output and builds validated probe argv.
    "src/platform/wsl_bridge.py",
]

# Read the types of imported modules without gating their existing diagnostics.
# Only the explicitly selected sources above belong to this increment.
follow_imports = "silent"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

# Ignore missing imports for optional/platform-specific dependencies
[[tool.mypy.overrides]]
module = ["winreg", "gi.*", "PIL.*", "psutil", "pytesseract", "yaml",
          "win32api", "win32con", "win32file", "win32security", "pywintypes",
          "ntsecuritycon", "notify2", "jsonschema"]
ignore_missing_imports = true

# Modules that use POSIX-only APIs (os.O_NOFOLLOW, os.getuid, os.killpg,
# signal.setitimer, the fork context). They are type checked by the Linux leg
# of the matrix only: the Windows leg would report the missing POSIX symbols
# instead of real defects. scripts/typecheck.py assembles the list for the
# requested platform. The table lives outside [tool.mypy] because mypy
# rejects unknown keys inside its own table.
[tool.typecheck]
posix_files = [
    "src/action_audit.py",
    "src/change_journal.py",
    "src/config_manager.py",
    "src/conversation_io.py",
    "src/document_store.py",
    "src/global_shortcuts.py",
    "src/privileged_helpers.py",
    "src/privileged_service.py",
    "src/privileged_write.py",
    "src/process_output.py",
    "src/remote_models.py",
    "src/screenshot_portal.py",
    "src/storage.py",
    "src/system_utils.py",
    "src/trial_recorder.py",
]
# Modules that only exist on native Windows. The Windows leg checks them.
windows_files = [
    "src/platform/windows_files.py",
    "src/platform/windows_process.py",
]

# Coverage measurement for the platform-independent core.
# The Linux job measures the core and the GTK track; the Qt and native
# Windows modules are verified by their own jobs, so the floor is enforced
# only over the modules that this job can execute.
[tool.coverage.run]
branch = true
source = ["src"]
parallel = false

[tool.coverage.report]
show_missing = true
precision = 1
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
# Floors enforced by scripts/check_coverage.py. A group without a floor is
# only reported: the Linux job cannot execute the Qt shell or the native
# Windows modules, so those are verified by their own jobs instead.
# The values are calibrated from the measured CI run and must never be
# lowered to make a change pass.
[tool.coverage.floors]
core = 78.0
gtk = 70.0

